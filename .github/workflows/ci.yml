name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Workspace layout contract tests
        run: npm run test:layout

      - name: API contract tests
        run: npm run test:api

      - name: Security incident tests
        run: npm run test:security-incidents

      - name: Equipment catalog validation
        run: npm run test:equipment-catalog

      - name: ETL tests
        run: npm run test:etl

      - name: Native ETL validation
        run: npm run etl:validate:all

      - name: Native source package validation
        run: npm run validate:source-packages

      - name: Turnout source package validation
        run: npm run validate:turnout-packages

      - name: Source acquisition tier validation
        run: npm run validate:source-acquisition-tiers

      - name: Electronic integrity registry validation
        run: npm run validate:electronic-integrity

      - name: Electronic integrity request workflow validation
        run: npm run validate:electronic-integrity-requests

      - name: Production map join validation
        run: npm run validate:maps

      - name: Production provenance validation
        run: npm run validate:provenance

      - name: Feature-enabled public equipment build
        run: npm run build
        env:
          EQUIPMENT_CATALOG_CHANNEL: public
          EQUIPMENT_EXPLORER_ENABLED: "1"
          NEXT_PUBLIC_EQUIPMENT_EXPLORER: "1"
          VERCEL_ENV: production

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Equipment browser tests
        run: npm run test:e2e:equipment

      - name: Workspace layout browser tests
        run: npm run test:e2e:workspace

  vercel-preview:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Vercel preview secrets
        id: vercel-secrets
        shell: bash
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Vercel preview deploy skipped because preview secrets are not configured for this workflow context."
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Pull Vercel environment
        if: steps.vercel-secrets.outputs.available == 'true'
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel output
        if: steps.vercel-secrets.outputs.available == 'true'
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          EQUIPMENT_CATALOG_CHANNEL: staging
          EQUIPMENT_EXPLORER_ENABLED: "1"
          NEXT_PUBLIC_EQUIPMENT_EXPLORER: "1"
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy preview
        id: deploy-preview
        if: steps.vercel-secrets.outputs.available == 'true'
        shell: bash
        run: |
          preview_url="$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Smoke-test security incident preview
        if: steps.vercel-secrets.outputs.available == 'true'
        run: node scripts/verify-security-incidents-deployment.mjs --base-url=${{ steps.deploy-preview.outputs.url }}

      - name: Smoke-test staging equipment preview
        if: steps.vercel-secrets.outputs.available == 'true'
        run: node scripts/verify-equipment-deployment.mjs --base-url=${{ steps.deploy-preview.outputs.url }} --expect-channel=staging
